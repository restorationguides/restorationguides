<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRT Examination | The Restoration Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/quiz.css">
</head>
<body class="exam-mode">

    <nav class="main-nav">
        <div class="nav-container">
            <a href="index.html" class="logo">Restoration Hub</a>
            <div class="nav-links">
                <a href="study-guide.html">Study Guides</a>
                <a href="quiz-portal.html" class="active">Certification</a>
            </div>
            <div class="nav-actions">
                <button id="theme-toggle" class="theme-btn"><span id="theme-icon">Dark Mode</span></button>
            </div>
        </div>
    </nav>

    <main class="quiz-main-container">
        <div class="quiz-card fade-in">
            <div class="quiz-progress">
                <div class="progress-meta">
                    <span id="score-display">Score: 0 / 82</span>
                    <span id="question-count">Question 1 of 82</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progress-fill" style="width: 0%;"></div>
                </div>
            </div>

            <div id="quiz-content">
                <h2 id="question">Initialising WRT Question Bank...</h2>
                <div id="quiz-options" class="options-grid">
                    </div>
                <div id="feedback" class="feedback-area"></div>
            </div>

            <div class="quiz-actions">
                <button id="next-button" class="btn-primary" style="display: none;">Submit & Next</button>
                <button id="restart-button" class="btn-secondary" style="display:none;">Restart Examination</button>
            </div>
        </div>
    </main>

    <button id="toggleCalculator" class="btn-calc-toggle">Open Calculator</button>
    
    <div id="calculatorModal" class="calc-drawer">
        <div class="calc-header">
            <span>Technical Calculator</span>
            <button id="closeCalculator">Close</button>
        </div>
        <div class="calc-body">
            <input type="text" id="calcDisplay" readonly placeholder="0">
            <div class="calc-grid">
                <button class="calc-btn operator">(</button>
                <button class="calc-btn operator">)</button>
                <button class="calc-btn operator">/</button>
                <button class="calc-btn backspace">⌫</button>

                <button class="calc-btn">7</button>
                <button class="calc-btn">8</button>
                <button class="calc-btn">9</button>
                <button class="calc-btn operator">*</button>

                <button class="calc-btn">4</button>
                <button class="calc-btn">5</button>
                <button class="calc-btn">6</button>
                <button class="calc-btn operator">-</button>

                <button class="calc-btn">1</button>
                <button class="calc-btn">2</button>
                <button class="calc-btn">3</button>
                <button class="calc-btn operator">+</button>

                <button class="calc-btn">0</button>
                <button class="calc-btn">.</button>
                <button class="calc-btn clear">C</button>
                <button class="calc-btn equal">=</button>
            </div>
        </div>
    </div>

    <script src="nav.js" defer></script>
    <script src="script.js" defer></script>
    <script src="calc.js" defer></script>
</body>
</html>
